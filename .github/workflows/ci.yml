name: Build and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_IMAGE: typing-defense-hw2:${{ github.sha }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/typing-defense-hw2

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test FastAPI container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name typing-defense-smoke --publish 18000:8000 "${LOCAL_IMAGE}"
          trap 'docker rm --force typing-defense-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18000/health
          curl --fail --silent http://127.0.0.1:18000/ | grep -F "Typing Defense v2"

      - name: Tag image for Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:latest"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"
