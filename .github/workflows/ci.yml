name: Build and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_IMAGE: typing-defense-hw2:${{ github.sha }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/typing-defense-hw2

jobs:
  docker:
    name: CI - Build, test, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test FastAPI container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name typing-defense-smoke --publish 18000:8000 "${LOCAL_IMAGE}"
          trap 'docker rm --force typing-defense-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18000/health
          curl --fail --silent http://127.0.0.1:18000/ | grep -F "Typing Defense v2"

      - name: Tag image for Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:latest"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"

  deploy:
    name: CD - Deploy on Windows self-hosted runner
    needs: docker
    if: ${{ needs.docker.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: typesprint-local-deploy
      cancel-in-progress: false
    env:
      DEPLOY_CONTAINER: typing-defense
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/typing-defense-hw2

    steps:
      - name: Log in to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $username = $env:DOCKERHUB_USERNAME.Trim()
          $token = $env:DOCKERHUB_TOKEN.Trim()
          if ([string]::IsNullOrWhiteSpace($username) -or [string]::IsNullOrWhiteSpace($token)) {
            throw 'Docker Hub credentials are missing.'
          }

          $startInfo = New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName = 'docker'
          $startInfo.Arguments = "login --username $username --password-stdin"
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true

          $dockerLogin = New-Object System.Diagnostics.Process
          $dockerLogin.StartInfo = $startInfo
          [void]$dockerLogin.Start()

          # Windows PowerShell 5.1의 네이티브 stdin 변환을 피하고,
          # BOM·추가 개행이 없는 UTF-8 바이트로 토큰을 전달합니다.
          $tokenBytes = [System.Text.Encoding]::UTF8.GetBytes($token)
          $dockerLogin.StandardInput.BaseStream.Write($tokenBytes, 0, $tokenBytes.Length)
          $dockerLogin.StandardInput.BaseStream.Close()

          $stdoutTask = $dockerLogin.StandardOutput.ReadToEndAsync()
          $stderrTask = $dockerLogin.StandardError.ReadToEndAsync()
          $dockerLogin.WaitForExit()
          $stdout = $stdoutTask.Result
          $stderr = $stderrTask.Result

          if ($dockerLogin.ExitCode -ne 0) {
            # 토큰·Docker 출력은 로그에 남기지 않습니다.
            throw "Docker Hub login failed with exit code $($dockerLogin.ExitCode)."
          }

          Write-Host 'Docker Hub login succeeded.'

      - name: Pull CI image by commit SHA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "sha-$($env:GITHUB_SHA.Substring(0, 12))"
          $image = "$($env:IMAGE_NAME):$tag"
          docker pull $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed: $image"
          }

      - name: Replace TypeSprint container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $container = $env:DEPLOY_CONTAINER
          $tag = "sha-$($env:GITHUB_SHA.Substring(0, 12))"
          $image = "$($env:IMAGE_NAME):$tag"
          $started = $false

          try {
            $existing = docker ps --all --quiet --filter "name=^/$container$"
            if ($existing) {
              docker rm --force $container
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove existing container: $container"
              }
            }

            docker run --detach --name $container --restart unless-stopped --publish 8000:8000 $image
            if ($LASTEXITCODE -ne 0) {
              throw "Could not start container: $container"
            }
            $started = $true
          }
          catch {
            if ($started) {
              docker logs $container
              docker rm --force $container 2>$null
            }
            throw
          }

      - name: Verify local health endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy = $false

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://127.0.0.1:8000/health'
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') {
                $healthy = $true
                Write-Host "Health check passed: $($response.Content)"
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $healthy) {
            docker logs $env:DEPLOY_CONTAINER
            throw 'TypeSprint health check failed at http://127.0.0.1:8000/health'
          }
