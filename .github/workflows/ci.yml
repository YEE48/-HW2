name: Build and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_IMAGE: typing-defense-hw2:${{ github.sha }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/typing-defense-hw2

jobs:
  docker:
    name: CI - Build, test, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test game difficulty configuration
        shell: bash
        run: node tests/test_game_config.js

      - name: Publish game test artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: game-config-results-${{ github.run_id }}
          path: artifacts/game-config-results.json
          if-no-files-found: error

      - name: Add game comparison to summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## Game difficulty comparison'
            echo
            echo '| Mode | Before speed | After speed | Spawn interval |'
            echo '| --- | ---: | ---: | ---: |'
            echo '| Baseline / Normal | 22–40 px/s | 22–40 px/s | 1450 ms |'
            echo '| Easy | 22–40 px/s | 14–21 px/s | 1900 ms |'
            echo '| Hard | 22–40 px/s | 41–62 px/s | 1000 ms |'
            echo
            echo 'Values are deterministic configuration values; speed samples use fixed random inputs 0, 0.5, and 1.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test FastAPI container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name typing-defense-smoke --publish 18000:8000 "${LOCAL_IMAGE}"
          trap 'docker rm --force typing-defense-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18000/health
          curl --fail --silent http://127.0.0.1:18000/ | grep -F "Typing Defense v2"

      - name: Tag image for Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:latest"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"

  deploy:
    name: CD - Deploy on Windows self-hosted runner
    needs: docker
    if: ${{ needs.docker.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: typesprint-local-deploy
      cancel-in-progress: false
    env:
      DEPLOY_CONTAINER: typing-defense
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/typing-defense-hw2

    steps:
      - name: Record service state before deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath artifacts/deploy-before.json, artifacts/deploy-monitoring.json -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $container = $env:DEPLOY_CONTAINER
          $id = [string](docker ps --all --quiet --filter "name=^/$container$" | Select-Object -First 1)
          $id = $id.Trim()
          $exists = -not [string]::IsNullOrWhiteSpace($id)
          $running = $false
          $health = 'not-checked'
          $healthContent = ''

          if ($exists) {
            $running = ((docker inspect --format '{{.State.Running}}' $container).Trim() -eq 'true')
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://127.0.0.1:8000/health'
              $healthContent = $response.Content
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') { $health = 'ok' } else { $health = 'unexpected-response' }
            }
            catch { $health = 'unavailable' }
          }

          $before = [ordered]@{
            container = $container
            exists = $exists
            running = $running
            health = $health
            healthContent = $healthContent
            recordedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $before | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 artifacts/deploy-before.json
          Write-Host ("Before deployment: exists={0}, running={1}, health={2}" -f $exists, $running, $health)

      - name: Pull CI image by commit SHA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "sha-$($env:GITHUB_SHA.Substring(0, 12))"
          $image = "$($env:IMAGE_NAME):$tag"
          docker pull $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed: $image"
          }

      - name: Replace TypeSprint container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $container = $env:DEPLOY_CONTAINER
          $tag = "sha-$($env:GITHUB_SHA.Substring(0, 12))"
          $image = "$($env:IMAGE_NAME):$tag"
          $started = $false

          try {
            $existing = docker ps --all --quiet --filter "name=^/$container$"
            if ($existing) {
              docker rm --force $container
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove existing container: $container"
              }
            }

            docker run --detach --name $container --restart unless-stopped --publish 8000:8000 $image
            if ($LASTEXITCODE -ne 0) {
              throw "Could not start container: $container"
            }
            $started = $true
          }
          catch {
            if ($started) {
              docker logs $container
              docker rm --force $container 2>$null
            }
            throw
          }

      - name: Verify local health endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy = $false

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://127.0.0.1:8000/health'
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') {
                $healthy = $true
                Write-Host "Health check passed: $($response.Content)"
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $healthy) {
            docker logs $env:DEPLOY_CONTAINER
            throw 'TypeSprint health check failed at http://127.0.0.1:8000/health'
          }

      - name: Monitor service for 30 seconds
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $successCount = 0
          $failureCount = 0
          $responseTimes = New-Object System.Collections.Generic.List[double]
          $samples = New-Object System.Collections.Generic.List[object]

          for ($sample = 1; $sample -le 30; $sample++) {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            $ok = $false
            $status = 'error'
            $detail = ''
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://127.0.0.1:8000/health'
              $detail = $response.Content
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') {
                $ok = $true
                $status = 'ok'
              } else {
                $status = "http-$($response.StatusCode)"
              }
            }
            catch { $detail = $_.Exception.Message }
            $watch.Stop()
            $milliseconds = [math]::Round($watch.Elapsed.TotalMilliseconds, 2)

            if ($ok) {
              $successCount++
              $responseTimes.Add($milliseconds)
            } else {
              $failureCount++
            }
            $samples.Add([ordered]@{
              sample = $sample
              status = $status
              ok = $ok
              responseTimeMs = $milliseconds
              detail = $detail
              recordedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            })
            Write-Host ("Monitor {0}/30: {1}, {2} ms" -f $sample, $status, $milliseconds)
            if ($sample -lt 30) { Start-Sleep -Seconds 1 }
          }

          $minimum = if ($responseTimes.Count) { ($responseTimes | Measure-Object -Minimum).Minimum } else { $null }
          $maximum = if ($responseTimes.Count) { ($responseTimes | Measure-Object -Maximum).Maximum } else { $null }
          $average = if ($responseTimes.Count) { [math]::Round(($responseTimes | Measure-Object -Average).Average, 2) } else { $null }
          $monitoring = [ordered]@{
            imageTag = "sha-$($env:GITHUB_SHA.Substring(0, 12))"
            container = $env:DEPLOY_CONTAINER
            durationSeconds = 30
            intervalSeconds = 1
            successCount = $successCount
            failureCount = $failureCount
            responseTimeMs = [ordered]@{ min = $minimum; average = $average; max = $maximum }
            samples = $samples
            recordedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $monitoring | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 artifacts/deploy-monitoring.json

          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "## CD deployment verification"
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY ""
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "| Item | Result |"
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "| --- | --- |"
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "| Image tag | sha-$($env:GITHUB_SHA.Substring(0, 12)) |"
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "| Container | $($env:DEPLOY_CONTAINER) |"
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "| Health samples | $successCount success / $failureCount failure |"
          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "| Response time | min $minimum ms / avg $average ms / max $maximum ms |"
          if ($failureCount -gt 0) { throw "30-second monitoring detected $failureCount failed health checks" }

      - name: Publish deployment artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-results-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
